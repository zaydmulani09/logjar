name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release
      - name: library builds without the CLI
        run: cargo build --lib --no-default-features

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets

  loghub:
    # Round-trips and searches two real LogHub datasets end to end.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/fetch-loghub.sh Zookeeper Linux
      - run: cargo build --release
      - name: round trip
        run: |
          for f in data/Zookeeper/Zookeeper.log data/Linux/Linux.log; do
            target/release/logjar pack -o /tmp/a.ljar "$f"
            target/release/logjar cat /tmp/a.ljar | cmp - "$f"
          done
      - name: grep agrees with grep
        run: |
          target/release/logjar pack -q -o /tmp/z.ljar data/Zookeeper/Zookeeper.log
          for q in "WARN" "Connection broken for id" "0x14ede63a5a70000"; do
            want=$(grep -cF "$q" data/Zookeeper/Zookeeper.log || true)
            got=$(target/release/logjar grep -c "$q" /tmp/z.ljar || true)
            echo "$q: grep=$want logjar=$got"
            test "$want" = "$got"
          done
      - name: grep -E agrees with grep -E
        # Zookeeper.log has CRLF endings; logjar's $ matches before the CR,
        # GNU grep's on Linux doesn't, so compare against CR-stripped lines.
        run: |
          tr -d '\r' < data/Zookeeper/Zookeeper.log > /tmp/z.log
          for q in 'id [0-9]+, my id = 3' '^2015-07-29 1[0-9]:.*(WARN|ERROR)' \
                   'session 0x[0-9a-f]+ ' 'Notification time out: [0-9]+$' '[0-9]$'; do
            want=$(grep -cE "$q" /tmp/z.log || true)
            got=$(target/release/logjar grep -c -E "$q" /tmp/z.ljar || true)
            echo "$q: grep=$want logjar=$got"
            test "$want" = "$got"
          done
