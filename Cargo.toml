[package]
name = "logjar"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Searchable compressed log archives: template/variable encoding with grep that skips what it can't match"
license = "MIT"
repository = "https://github.com/zaydmulani09/logjar"
readme = "README.md"
keywords = ["logs", "compression", "search", "grep", "archive"]
categories = ["compression", "command-line-utilities", "database-implementations"]

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
crc32fast = "1.4"
flate2 = { version = "1", optional = true }
zstd = { version = "0.13", default-features = false }

[features]
default = ["cli"]
# The command-line tool. Library users can opt out with default-features = false.
cli = ["dep:clap", "dep:flate2"]

[[bin]]
name = "logjar"
required-features = ["cli"]

[profile.release]
lto = "thin"
codegen-units = 1

[[test]]
name = "cli"
required-features = ["cli"]

[dev-dependencies]
regex = "1"
