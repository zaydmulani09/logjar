[package]
name = "logjar"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Searchable compressed log archives: template/variable encoding with grep that skips what it can't match"
license = "MIT"
repository = "https://github.com/zaydmulani09/logjar"
readme = "README.md"
keywords = ["logs", "compression", "search", "grep", "archive"]
categories = ["compression", "command-line-utilities", "database-implementations"]

[dependencies]
zstd = { version = "0.13", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
